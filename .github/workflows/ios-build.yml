name: iOS Build — Acuérdate

on:
  push:
    branches: [main]
    paths: ['ios-app/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build (sin firma — para AltStore / Sideloadly)
        run: |
          xcodebuild build \
            -project ios-app/Acuerdate.xcodeproj \
            -scheme Acuerdate \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Empaquetar IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/build/Acuerdate.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r Acuerdate.ipa Payload/
          echo "Tamaño IPA: $(du -sh Acuerdate.ipa | cut -f1)"

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Acuerdate-iOS-build-${{ github.run_number }}
          path: ${{ runner.temp }}/Acuerdate.ipa
          retention-days: 30
